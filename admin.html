<title>Hjulmann Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f5f4;
  --white: #ffffff;
  --border: #e5e5e3;
  --border2: #d4d4d2;
  --text: #1a1a18;
  --muted: #78787a;
  --muted2: #b0b0ae;
  --accent: #1a1a18;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --green-border: #bbf7d0;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --radius: 12px;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* Lock */
#lock { position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999; }
#lock-box { width:300px;display:flex;flex-direction:column;gap:12px; }
#lock-logo { font-size:22px;font-weight:700;letter-spacing:-.03em; }
#lock-sub { font-size:13px;color:var(--muted); }
#lock-input { background:#fff;border:1.5px solid var(--border2);border-radius:9px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;width:100%;color:var(--text); }
#lock-input:focus { border-color:var(--accent); }
#lock-err { color:var(--red);font-size:12px;display:none; }
#lock-btn { background:var(--accent);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit; }
#lock-user { background:#fff;border:1.5px solid var(--border2);border-radius:9px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;width:100%;color:var(--text); }
#lock-user:focus { border-color:var(--accent); }

header { padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid var(--border); }
.logo { font-size:14px;font-weight:700;letter-spacing:-.02em; }
.logo span { color:var(--muted);font-weight:400; }

.tabs { display:flex;padding:0 24px;border-bottom:1px solid var(--border);background:#fff; }
.tab-btn { padding:12px 14px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;font-family:inherit; }
.tab-btn.active { color:var(--text);border-bottom-color:var(--text); }

.badge { border-radius:100px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px; }
.badge-dark { background:var(--text);color:#fff; }
.badge-muted { background:var(--border);color:var(--muted); }

main { padding:24px;max-width:900px;width:100%;margin:0 auto; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* Stat cards */
.stat-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px; }
.stat-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px; }
.stat-card .val { font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1; }
.stat-card .lbl { font-size:12px;color:var(--muted);margin-top:5px; }
.stat-card.accent { background:var(--accent);color:#fff; }
.stat-card.accent .lbl { color:rgba(255,255,255,.55); }

/* Toolbar */
.toolbar { display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap; }
.toolbar-left { flex:1;display:flex;align-items:center;gap:8px; }
.search-wrap { position:relative; }
.search-icon { position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none;font-size:13px; }
.search-wrap input { background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 11px 8px 32px;font-size:13px;font-family:inherit;color:var(--text);outline:none;width:200px; }
.search-wrap input:focus { border-color:var(--text); }
.filter-select { background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:inherit;color:var(--text);outline:none;appearance:none;cursor:pointer; }

.btn { background:var(--white);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit; }
.btn:hover { background:var(--bg); }
.btn-dark { background:var(--accent);color:#fff;border-color:var(--accent); }
.btn-dark:hover { background:#2e2e2c; }
.btn-sm { padding:7px 14px;font-size:13px;border-radius:7px; }
.btn-ghost { border-color:transparent;background:none; }
.btn-ghost:hover { background:var(--bg); }
.btn-danger { color:var(--red);background:var(--red-bg);border-color:#fecaca; }
.btn-green { color:var(--green);background:var(--green-bg);border-color:var(--green-border); }

/* Inquiry cards */
.inq-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden; }
.inq-card.unread { border-left:4px solid var(--text); }

.inq-header { padding:22px 24px;display:flex;align-items:center;gap:18px;cursor:pointer; }
.avatar { width:50px;height:50px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;color:var(--text); }
.inq-main { flex:1;min-width:0; }
.inq-name { font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.pill { font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;border:1px solid var(--border);color:var(--muted);background:var(--bg);letter-spacing:.03em;text-transform:uppercase; }
.pill.new { background:var(--text);color:#fff;border-color:var(--text); }
.inq-sub { color:var(--muted);font-size:14px;margin-top:5px; }
.inq-time { font-size:12px;color:var(--muted2);margin-top:4px; }
.inq-actions { display:flex;gap:8px;align-items:center;flex-shrink:0; }

.inq-body { display:none;border-top:1px solid var(--border);padding:16px; }
.inq-body.open { display:block; }

.det-section { margin-bottom:18px; }
.det-section h4 { font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px; }
.det-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.det-field { display:flex;flex-direction:column;gap:3px; }
.det-field label { font-size:11px;color:var(--muted);font-weight:500; }
.det-field .val { font-size:14px;font-weight:500; }
.det-field .val a { color:inherit;text-decoration:underline;text-underline-offset:2px; }
.msg-box { background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.6; }

.action-row { display:flex;gap:7px;padding-top:14px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap; }
.price-wrap { margin-left:auto;display:flex;align-items:center;gap:7px; }
.price-wrap label { font-size:12px;color:var(--muted); }
.price-input { background:var(--white);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none;width:85px;text-align:right; }
.price-input:focus { border-color:var(--text); }

/* Events table */
.evt-table { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
.evt-table-head { display:grid;grid-template-columns:90px 1fr 100px 110px 90px;padding:10px 16px;border-bottom:1px solid var(--border); }
.evt-table-head span { font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase; }
.evt-row { display:grid;grid-template-columns:90px 1fr 100px 110px 90px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;align-items:center; }
.evt-row:last-child { border-bottom:none; }
.evt-row:hover { background:var(--bg); }
.evt-row.selected { background:var(--bg); }
.evt-row .date { font-size:12px;color:var(--muted); }
.evt-row .ename { font-size:14px;font-weight:600; }
.evt-row .esub { font-size:12px;color:var(--muted);margin-top:2px; }
.evt-row .etype { font-size:12px;color:var(--muted); }
.evt-row .etime { font-size:12px;color:var(--muted); }
.evt-row .eprice { font-size:13px;font-weight:600;text-align:right; }

/* Event detail */
.evt-detail { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);margin-top:10px;overflow:hidden;display:none; }
.evt-detail.open { display:block; }
.evt-detail-head { padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
.evt-detail-head h3 { font-size:16px;font-weight:700;letter-spacing:-.02em; }
.evt-detail-head .sub { font-size:12px;color:var(--muted);margin-top:2px; }
.evt-detail-body { padding:16px;display:grid;gap:12px; }
.det-sections { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.det-sec { background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:14px; }
.det-sec h4 { font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px; }
.nf { display:flex;flex-direction:column;gap:4px;margin-bottom:10px; }
.nf:last-child { margin-bottom:0; }
.nf label { font-size:11px;color:var(--muted);font-weight:500; }
.nf .big-val { font-size:15px;font-weight:600; }
.nf input,.nf textarea { background:var(--white);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none;resize:none; }
.nf input:focus,.nf textarea:focus { border-color:var(--text); }
.two-col { display:grid;grid-template-columns:1fr 1fr;gap:8px; }


.empty { text-align:center;padding:60px 20px;color:var(--muted); }
.empty h3 { font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px; }

/* Modal */
.overlay { position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:16px; }
.overlay.open { display:flex; }
.modal { background:var(--white);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15); }
.modal-head { padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
.modal-head h2 { font-size:16px;font-weight:700; }
.modal-body { padding:20px;display:grid;gap:12px; }
.modal-foot { padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px; }
.form-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.fg { display:flex;flex-direction:column;gap:4px; }
.fg.full { grid-column:1/-1; }
.fg label { font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase; }
.fg input,.fg select,.fg textarea { background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);outline:none;appearance:none;resize:vertical; }
.fg input:focus,.fg select:focus,.fg textarea:focus { border-color:var(--text); }

.toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;transition:transform .22s;pointer-events:none; }
.toast.show { transform:translateX(-50%) translateY(0); }

@media(max-width:700px) {
  .stat-grid { grid-template-columns:1fr; }
  .det-sections,.two-col { grid-template-columns:1fr; }
  .evt-table-head,.evt-row { grid-template-columns:70px 1fr 80px; }
  .evt-table-head span:nth-child(n+4),.evt-row>*:nth-child(n+4) { display:none; }
  main,header,.tabs { padding-left:16px;padding-right:16px; }
  .search-wrap input { width:140px; }
}
</style>

<div id="lock">
  <div id="lock-box">
    <div id="lock-logo">Hjulmann</div>
    <p id="lock-sub">Log ind</p>
    <input id="lock-user" type="text" placeholder="Brugernavn" onkeydown="if(event.key==='Enter')document.getElementById('lock-input').focus()" autocomplete="username" />
    <input id="lock-input" type="password" placeholder="Adgangskode" onkeydown="if(event.key==='Enter')checkPw()" autocomplete="current-password" />
    <div id="lock-err">Forkert brugernavn eller adgangskode.</div>
    <button id="lock-btn" onclick="checkPw()">Log ind</button>
  </div>
</div>
<script>(function(){if(sessionStorage.getItem('hja')==='1')document.getElementById('lock').style.display='none';window.checkPw=function(){var u=document.getElementById('lock-user').value.trim();var p=document.getElementById('lock-input').value;if(u==='admin'&&p==='Alexander281!'){sessionStorage.setItem('hja','1');document.getElementById('lock').style.display='none';}else{document.getElementById('lock-err').style.display='block';document.getElementById('lock-input').value='';document.getElementById('lock-input').focus();}};})();</script>

<header>
  <div class="logo">Hjulmann <span>admin</span></div>
  <div style="display:flex;gap:7px">
    <button class="btn btn-sm" onclick="exportData()">↓ CSV</button>
    <button class="btn btn-dark btn-sm" onclick="openModal()">+ Forespørgsel</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('overblik',this)">Overblik</button>
  <button class="tab-btn" onclick="switchTab('forespoergsler',this)">Forespørgsler <span class="badge badge-dark" id="bf">0</span></button>
  <button class="tab-btn" onclick="switchTab('events',this)">Kommende <span class="badge badge-muted" id="be">0</span></button>
</div>

<main>
  <div class="tab-panel active" id="tab-overblik">
    <div class="stat-grid" id="stat-grid"></div>
    <div style="font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Kommende events</div>
    <div id="overview-list"></div>
  </div>

  <div class="tab-panel" id="tab-forespoergsler">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="search-inq" placeholder="Søg..." oninput="renderInquiries()" />
        </div>
        <select class="filter-select" id="filter-type" onchange="renderInquiries()">
          <option value="">Alle typer</option>
          <option>Bryllup</option><option>Fødselsdag</option><option>Konfirmation</option>
          <option>Firmafest</option><option>Privatfest</option><option>Andet</option>
        </select>
      </div>
      <span id="inq-count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="inq-list"></div>
  </div>

  <div class="tab-panel" id="tab-events">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="search-evt" placeholder="Søg..." oninput="renderEvents()" />
        </div>
      </div>
    </div>
    <div id="evt-list"></div>
    <div id="evt-detail-panel"></div>
  </div>

</main>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-head">
      <h2>Ny forespørgsel</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="fg"><label>Navn *</label><input id="m-name" placeholder="Fuldt navn" /></div>
        <div class="fg"><label>Email *</label><input id="m-email" type="email" placeholder="din@email.dk" /></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>Telefon</label><input id="m-phone" type="tel" placeholder="12 34 56 78" /></div>
        <div class="fg"><label>Eventtype</label><select id="m-type"><option>Bryllup</option><option>Fødselsdag</option><option>Konfirmation</option><option>Firmafest</option><option>Privatfest</option><option>Andet</option></select></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>Dato</label><input id="m-date" type="date" /></div>
        <div class="fg"><label>Antal gæster</label><select id="m-guests"><option>0-50</option><option>50-100</option><option>100-200</option><option>200-400</option><option>400+</option></select></div>
      </div>
      <div class="fg full"><label>By / Venue</label><input id="m-location" placeholder="F.eks. Roskilde, Næstved..." /></div>
      <div class="fg full"><label>Besked</label><textarea id="m-msg" rows="3" placeholder="Tema, musikønsker, særlige øjeblikke..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Annuller</button>
      <button class="btn btn-dark" onclick="addInquiry()">Tilføj</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='hjulmann-v5';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch{}return{inquiries:[],events:[],archive:[]};}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}}

let data=load(),openEvtId=null;
if(!data.archive)data.archive=[];

if(!data.inquiries.length&&!data.events.length){
  data.inquiries=[
    {id:uid(),name:'Jonas Andersen',email:'jonas@example.dk',phone:'12 34 56 78',type:'Bryllup',date:'2026-09-20',guests:'50-100',location:'Roskilde',msg:'Vi søger en DJ til vores bryllup. Vi er meget glade for house og pop.',received:new Date().toISOString(),unread:true,price:''},
    {id:uid(),name:'Sofie Laursen',email:'sofie@example.dk',phone:'87 65 43 21',type:'Fødselsdag',date:'2026-10-05',guests:'0-50',location:'København',msg:"Privat fest, 30 år. Ønsker 90'er og 00'er hits.",received:new Date().toISOString(),unread:true,price:''},
  ];
  data.events=[
    {id:uid(),name:'Emma & Mads',type:'Bryllup',date:'2026-09-14',guests:'100-200',location:'Næstved',email:'emma@example.dk',phone:'',msg:'',address:'Skovvej 12, 4700 Næstved',venue:'Skovgaarden',startTime:'18:00',endTime:'02:00',notes:'Bruger eget PA. Parkering foran bygningen.',price:'4500'},
  ];
  save(data);
}

function uid(){return Math.random().toString(36).slice(2,10);}
function fmtDate(s,long){if(!s)return'–';const d=new Date(s+'T00:00:00');return long?d.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):d.toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});}
function ini(n){return n.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();}
function timeAgo(iso){const diff=Date.now()-new Date(iso).getTime();const h=Math.floor(diff/3600000);if(h<1)return'Lige nu';if(h<24)return h+'t siden';const d=Math.floor(h/24);return d===1?'I går':d+' dage siden';}

function renderOverview(){
  const rev=data.events.reduce((s,e)=>s+(parseFloat(e.price)||0),0);
  const unread=data.inquiries.filter(i=>i.unread).length;
  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-card accent">
      <div class="val">${data.events.length}</div>
      <div class="lbl">Kommende events</div>
    </div>
    <div class="stat-card">
      <div class="val">${data.inquiries.length}${unread?` <sup style="font-size:14px;color:var(--muted)">+${unread}</sup>`:''}  </div>
      <div class="lbl">Forespørgsler${unread?' · '+unread+' nye':''}</div>
    </div>
    <div class="stat-card">
      <div class="val" style="font-size:22px">${rev?rev.toLocaleString('da-DK')+' kr':'–'}</div>
      <div class="lbl">Samlet honorar</div>
    </div>
  `;

  const sorted=[...data.events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const ovl=document.getElementById('overview-list');
  if(!sorted.length){ovl.innerHTML='<div class="empty"><h3>Ingen kommende events</h3><p>Bekræftede bookings vises her.</p></div>';return;}
  ovl.innerHTML=`
    <div class="evt-table">
      <div class="evt-table-head"><span>Dato</span><span>Navn</span><span>Type</span><span>Tid</span><span style="text-align:right">Honorar</span></div>
      ${sorted.map(ev=>`
        <div class="evt-row" onclick="goToEvent('${ev.id}')">
          <div class="date">${fmtDate(ev.date)}</div>
          <div><div class="ename">${ev.name}</div><div class="esub">${ev.location||''}</div></div>
          <div class="etype">${ev.type}</div>
          <div class="etime">${ev.startTime||'–'}${ev.endTime?'–'+ev.endTime:''}</div>
          <div class="eprice">${ev.price?parseFloat(ev.price).toLocaleString('da-DK')+' kr':'–'}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function goToEvent(id){openEvtId=id;switchTab('events',document.querySelectorAll('.tab-btn')[2]);renderEvents();}

function renderInquiries(){
  const list=document.getElementById('inq-list');
  const q=(document.getElementById('search-inq').value||'').toLowerCase();
  const ft=document.getElementById('filter-type').value;
  const items=data.inquiries.filter(i=>(!q||(i.name+i.email+i.location).toLowerCase().includes(q))&&(!ft||i.type===ft));
  document.getElementById('bf').textContent=data.inquiries.filter(i=>i.unread).length||data.inquiries.length||'0';
  document.getElementById('inq-count').textContent=items.length+' vist';
  if(!items.length){list.innerHTML=`<div class="empty"><h3>${data.inquiries.length?'Ingen resultater':'Ingen forespørgsler endnu'}</h3></div>`;return;}
  list.innerHTML=items.map(q=>`
    <div class="inq-card${q.unread?' unread':''}" id="card-${q.id}">
      <div class="inq-header" onclick="openInq('${q.id}')">
        <div class="avatar">${ini(q.name)}</div>
        <div class="inq-main">
          <div class="inq-name">${q.name}${q.unread?' <span class="pill new">NY</span>':''} <span class="pill">${q.type}</span>${q.date?` <span class="pill">${fmtDate(q.date)}</span>`:''}</div>
          <div class="inq-sub">${q.email}${q.phone?' · '+q.phone:''}${q.guests?' · '+q.guests+' gæster':''}${q.location?' · '+q.location:''}</div>
          <div class="inq-time">${timeAgo(q.received)}</div>
        </div>
        <div class="inq-actions" onclick="event.stopPropagation()">
          <button class="btn btn-dark btn-sm" onclick="confirmInq('${q.id}')">Bekræft</button>
          <button class="btn btn-sm" onclick="archiveInq('${q.id}')">Afvis</button>
        </div>
      </div>
      <div class="inq-body" id="qb-${q.id}">
        <div class="det-section">
          <h4>Kundeoplysninger</h4>
          <div class="det-grid">
            <div class="det-field"><label>Navn</label><div class="val">${q.name}</div></div>
            <div class="det-field"><label>Email</label><div class="val"><a href="mailto:${q.email}">${q.email||'–'}</a></div></div>
            <div class="det-field"><label>Telefon</label><div class="val">${q.phone?`<a href="tel:${q.phone}">${q.phone}</a>`:'–'}</div></div>
            <div class="det-field"><label>By / Venue</label><div class="val">${q.location||'–'}</div></div>
          </div>
        </div>
        <div class="det-section">
          <h4>Event detaljer</h4>
          <div class="det-grid">
            <div class="det-field"><label>Dato</label><div class="val">${fmtDate(q.date,true)}</div></div>
            <div class="det-field"><label>Type</label><div class="val">${q.type}</div></div>
            <div class="det-field"><label>Antal gæster</label><div class="val">${q.guests||'–'}</div></div>
          </div>
        </div>
        ${q.msg?`<div class="det-section"><h4>Besked</h4><div class="msg-box">${q.msg}</div></div>`:''}
        <div class="action-row">
          <button class="btn btn-dark btn-sm" onclick="confirmInq('${q.id}')">✓ Bekræft booking</button>
          <button class="btn btn-sm" onclick="archiveInq('${q.id}')">Afvis</button>
          <div class="price-wrap"><label>Tilbudt pris</label><input class="price-input" type="number" placeholder="0" value="${q.price||''}" onchange="updInq('${q.id}','price',this.value)" /> kr</div>
        </div>
      </div>
    </div>
  `).join('');
}

function openInq(id){
  const q=data.inquiries.find(i=>i.id===id);
  if(q&&q.unread){q.unread=false;save(data);renderOverview();}
  document.getElementById('card-'+id)?.classList.remove('unread');
  document.getElementById('qb-'+id)?.classList.toggle('open');
}

function renderEvents(){
  const q=(document.getElementById('search-evt').value||'').toLowerCase();
  const items=[...data.events].filter(e=>!q||(e.name+e.location).toLowerCase().includes(q)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  document.getElementById('be').textContent=data.events.length;
  const list=document.getElementById('evt-list');
  if(!items.length){list.innerHTML='<div class="empty"><h3>Ingen kommende events</h3></div>';document.getElementById('evt-detail-panel').innerHTML='';return;}
  list.innerHTML=`
    <div class="evt-table">
      <div class="evt-table-head"><span>Dato</span><span>Navn</span><span>Type</span><span>Tid</span><span style="text-align:right">Honorar</span></div>
      ${items.map(ev=>`
        <div class="evt-row${openEvtId===ev.id?' selected':''}" onclick="openEvtDetail('${ev.id}')">
          <div class="date">${fmtDate(ev.date)}</div>
          <div><div class="ename">${ev.name}</div><div class="esub">${ev.location||''}</div></div>
          <div class="etype">${ev.type}</div>
          <div class="etime">${ev.startTime||'–'}${ev.endTime?'–'+ev.endTime:''}</div>
          <div class="eprice">${ev.price?parseFloat(ev.price).toLocaleString('da-DK')+' kr':'–'}</div>
        </div>
      `).join('')}
    </div>
  `;
  if(openEvtId){const ev=data.events.find(e=>e.id===openEvtId);if(ev)renderEvtDetail(ev);else{document.getElementById('evt-detail-panel').innerHTML='';openEvtId=null;}}
  else document.getElementById('evt-detail-panel').innerHTML='';
}

function openEvtDetail(id){openEvtId=(openEvtId===id)?null:id;renderEvents();}

function renderEvtDetail(ev){
  document.getElementById('evt-detail-panel').innerHTML=`
    <div class="evt-detail open">
      <div class="evt-detail-head">
        <div><h3>${ev.name}</h3><div class="sub">${ev.type}${ev.location?' · '+ev.location:''}</div></div>
        <div style="display:flex;gap:7px">
          <button class="btn btn-sm btn-green" onclick="doneEvent('${ev.id}')">✓ Afholdt</button>
          <button class="btn btn-sm btn-danger" onclick="rmEvent('${ev.id}')">Slet</button>
          <button class="btn btn-sm btn-ghost" onclick="openEvtId=null;renderEvents()">✕</button>
        </div>
      </div>
      <div class="evt-detail-body">
        <div class="det-sections">
          <div class="det-sec">
            <h4>Event detaljer</h4>
            <div class="nf"><label>Dato</label><div class="big-val">${fmtDate(ev.date,true)}</div></div>
            <div class="two-col">
              <div class="nf"><label>Starttid</label><input type="time" value="${ev.startTime||''}" onchange="updEv('${ev.id}','startTime',this.value)" /></div>
              <div class="nf"><label>Sluttid</label><input type="time" value="${ev.endTime||''}" onchange="updEv('${ev.id}','endTime',this.value)" /></div>
            </div>
            <div class="nf"><label>Adresse</label><input value="${ev.address||''}" onchange="updEv('${ev.id}','address',this.value)" placeholder="Vejnavn, postnr, by" /></div>
            <div class="nf"><label>Venue</label><input value="${ev.venue||''}" onchange="updEv('${ev.id}','venue',this.value)" placeholder="Salens navn" /></div>
            <div class="nf"><label>Honorar (kr)</label><input type="number" value="${ev.price||''}" onchange="updEv('${ev.id}','price',this.value)" placeholder="0" /></div>
          </div>
          <div class="det-sec">
            <h4>Kunde</h4>
            <div class="nf"><label>Navn</label><div class="big-val">${ev.name}</div></div>
            <div class="nf"><label>Email</label><input value="${ev.email||''}" onchange="updEv('${ev.id}','email',this.value)" placeholder="Email" /></div>
            <div class="nf"><label>Telefon</label><input value="${ev.phone||''}" onchange="updEv('${ev.id}','phone',this.value)" placeholder="12 34 56 78" /></div>
            <div class="nf"><label>Gæster</label><div class="big-val">${ev.guests||'–'}</div></div>
          </div>
        </div>
        <div class="det-sec">
          <h4>Interne noter</h4>
          <textarea rows="4" onchange="updEv('${ev.id}','notes',this.value)" placeholder="Udstyr, parkering, musikønsker, særlige øjeblikke..." style="width:100%">${ev.notes||''}</textarea>
        </div>
      </div>
    </div>
  `;
}

function renderArchive(){
  const n=data.archive.length;
  document.getElementById('ba').textContent=n;
  document.getElementById('ark-count').textContent=n+' poster';
  const list=document.getElementById('ark-list');
  if(!n){list.innerHTML='<div class="empty"><h3>Arkivet er tomt</h3></div>';return;}
  list.innerHTML=[...data.archive].reverse().map(a=>`
    <div class="ark-row">
      <div class="avatar">${ini(a.name)}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${a.name} <span class="pill">${a.type}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">${a.reason||'Afvist'} · ${fmtDate(a.date)}</div></div>
    </div>
  `).join('');
}

function render(){renderOverview();renderInquiries();renderEvents();}

function confirmInq(id){
  const q=data.inquiries.find(i=>i.id===id);if(!q)return;
  data.inquiries=data.inquiries.filter(i=>i.id!==id);
  data.events.push({id:uid(),name:q.name,type:q.type,date:q.date,guests:q.guests,location:q.location,email:q.email,phone:q.phone,msg:q.msg,address:'',venue:'',startTime:'',endTime:'',notes:'',price:q.price||''});
  save(data);render();toast('Booking bekræftet');
  switchTab('events',document.querySelectorAll('.tab-btn')[2]);
}

function archiveInq(id){if(!confirm('Slet denne forespørgsel?'))return;data.inquiries=data.inquiries.filter(i=>i.id!==id);save(data);render();}
function doneEvent(id){if(!confirm('Marker som afholdt og slet?'))return;data.events=data.events.filter(e=>e.id!==id);openEvtId=null;save(data);render();toast('Event slettet');}
function rmEvent(id){if(!confirm('Slet dette event?'))return;data.events=data.events.filter(e=>e.id!==id);openEvtId=null;save(data);render();}
function updEv(id,key,val){const ev=data.events.find(e=>e.id===id);if(ev){ev[key]=val;save(data);renderOverview();}}
function updInq(id,key,val){const q=data.inquiries.find(i=>i.id===id);if(q){q[key]=val;save(data);}}

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}
function openModal(){document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function overlayClick(e){if(e.target.id==='overlay')closeModal();}

function addInquiry(){
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim();
  if(!name||!email){alert('Navn og email er påkrævet.');return;}
  data.inquiries.unshift({id:uid(),name,email,phone:document.getElementById('m-phone').value.trim(),type:document.getElementById('m-type').value,date:document.getElementById('m-date').value,guests:document.getElementById('m-guests').value,location:document.getElementById('m-location').value.trim(),msg:document.getElementById('m-msg').value.trim(),received:new Date().toISOString(),unread:true,price:''});
  save(data);render();closeModal();toast('Forespørgsel tilføjet');
  ['m-name','m-email','m-phone','m-date','m-location','m-msg'].forEach(id=>document.getElementById(id).value='');
}

function exportData(){
  const rows=[['Navn','Email','Telefon','Type','Dato','Gæster','Lokation','Besked','Pris']];
  [...data.inquiries,...data.events].forEach(r=>rows.push([r.name,r.email,r.phone,r.type,r.date,r.guests,r.location,r.msg||r.notes,(r.price||'')+' kr']));
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='hjulmann.csv';a.click();
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

render();
</script>

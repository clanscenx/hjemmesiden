<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Hjulmann Events</title>
<link rel="apple-touch-icon" href="logo.png" />
<link rel="icon" href="logo.png" type="image/png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hjulmann Events" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2f2f0;
  --surface:#ffffff;
  --surface2:#f8f8f7;
  --border:#e8e8e6;
  --border2:#d8d8d6;
  --text:#1a1a18;
  --text2:#3a3a38;
  --muted:#72726e;
  --muted2:#adadaa;
  --accent:#1a1a18;
  --accent2:#2e2e2c;
  --green:#059669;
  --green-bg:#ecfdf5;
  --green-border:#a7f3d0;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --red-border:#fecaca;
  --blue:#2563eb;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);
  --radius:14px;
  --radius-sm:9px;
  --radius-xs:6px;
}
html{-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── Lock ── */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;}
#lock-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;}
#lock-logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#lock-logo-img{width:36px;height:36px;border-radius:9px;}
#lock-logo{font-size:20px;font-weight:800;letter-spacing:-.04em;}
#lock-sub{font-size:13px;color:var(--muted);margin-top:-8px;}
.lock-field{display:flex;flex-direction:column;gap:5px;}
.lock-field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
#lock-user,#lock-input{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:13px 15px;font-size:16px;font-family:inherit;outline:none;width:100%;color:var(--text);transition:border-color .15s;}
#lock-user:focus,#lock-input:focus{border-color:var(--accent);}
#lock-err{color:var(--red);font-size:12px;display:none;background:var(--red-bg);padding:9px 12px;border-radius:var(--radius-xs);border:1px solid var(--red-border);}
#lock-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:2px;}
#lock-btn:active{background:var(--accent2);}
#lock-pw-wrap{position:relative;display:flex;align-items:center;}
#lock-pw-wrap #lock-input{padding-right:46px;}
#lock-eye{position:absolute;right:13px;background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center;}

/* ── Header ── */
header{padding:0 16px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;height:calc(48px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(242,242,240,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20;border-bottom:1px solid var(--border);}
.logo-wrap{display:flex;align-items:center;gap:8px;}
.logo-img{width:24px;height:24px;border-radius:6px;}
.logo{font-size:14px;font-weight:700;letter-spacing:-.025em;}
.logo span{color:var(--muted);font-weight:400;}
.header-actions{display:flex;gap:5px;}

/* ── Tabs ── */
.tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(242,242,240,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:19;}
.tab-btn{padding:10px 11px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px;font-family:inherit;transition:color .15s;}
.tab-btn.active{color:var(--text);border-bottom-color:var(--text);}
.badge{border-radius:100px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.badge-dark{background:var(--text);color:#fff;}
.badge-muted{background:var(--border);color:var(--muted);}

/* ── Main ── */
main{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-width:860px;width:100%;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── Buttons ── */
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:background .12s,border-color .12s;box-shadow:var(--shadow-sm);}
.btn:active{background:var(--surface2);}
.btn-dark{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.18);}
.btn-dark:active{background:var(--accent2);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:var(--radius-xs);}
.btn-ghost{border-color:transparent;background:none;box-shadow:none;}
.btn-ghost:active{background:var(--surface2);}
.btn-danger{color:var(--red);background:var(--red-bg);border-color:var(--red-border);box-shadow:none;}
.btn-green{color:var(--green);background:var(--green-bg);border-color:var(--green-border);box-shadow:none;}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow-sm);}
.stat-card .s-icon{font-size:20px;margin-bottom:10px;}
.stat-card .val{font-size:28px;font-weight:800;letter-spacing:-.05em;line-height:1;}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500;}
.stat-card.accent{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2);}
.stat-card.accent .lbl{color:rgba(255,255,255,.5);}

/* ── Next event hero ── */
.next-hero{background:var(--accent);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:18px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .12s;}
.next-hero:active{transform:scale(.99);}
.next-hero .nh-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:7px;}
.next-hero .nh-name{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;}
.next-hero .nh-sub{font-size:13px;opacity:.6;}
.next-hero .nh-right{text-align:right;flex-shrink:0;}
.next-hero .nh-days{font-size:36px;font-weight:800;letter-spacing:-.05em;line-height:1;}
.next-hero .nh-days-lbl{font-size:10px;opacity:.5;margin-top:1px;}
.next-hero .nh-price{font-size:13px;opacity:.65;margin-top:8px;}

/* ── Section header ── */
.section-head{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar-left{flex:1;display:flex;align-items:center;gap:7px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none;font-size:14px;}
.search-wrap input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px 8px 32px;font-size:14px;font-family:inherit;color:var(--text);outline:none;width:190px;box-shadow:var(--shadow-sm);}
.search-wrap input:focus{border-color:var(--accent);}
.filter-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;font-size:14px;font-family:inherit;color:var(--text);outline:none;appearance:none;cursor:pointer;box-shadow:var(--shadow-sm);}
.inq-count-lbl{font-size:12px;color:var(--muted);margin-left:auto;}

/* ── Inquiry cards ── */
.inq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .15s;}
.inq-card.unread{border-left:3px solid var(--text);}
.inq-header{padding:16px;cursor:pointer;}
.inq-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.inq-name{font-weight:700;font-size:16px;letter-spacing:-.025em;}
.inq-time{font-size:11px;color:var(--muted2);flex-shrink:0;margin-top:2px;}
.inq-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;border:1px solid var(--border);color:var(--muted);background:var(--surface2);letter-spacing:.04em;text-transform:uppercase;}
.pill.new{background:var(--text);color:#fff;border-color:var(--text);}
.inq-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.inq-meta-item .lbl{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;}
.inq-meta-item .val{font-size:13px;font-weight:500;color:var(--text);margin-top:1px;}
.inq-actions{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--border);}
.inq-actions .btn{flex:1;justify-content:center;font-size:13px;}

.inq-body{display:none;border-top:1px solid var(--border);padding:16px;background:var(--surface2);}
.inq-body.open{display:block;}
.det-section{margin-bottom:16px;}
.det-section:last-child{margin-bottom:0;}
.det-section h4{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.det-field label{font-size:10px;color:var(--muted2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.det-field .val{font-size:14px;font-weight:500;margin-top:2px;}
.det-field .val a{color:inherit;text-decoration:underline;text-underline-offset:3px;}
.msg-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px;font-size:13px;color:var(--text2);white-space:pre-wrap;line-height:1.6;}
.action-row{display:flex;gap:7px;padding-top:14px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.price-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;}
.price-wrap label{font-size:12px;color:var(--muted);}
.price-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none;width:85px;text-align:right;}
.price-input:focus{border-color:var(--text);}

/* ── Events table ── */
.evt-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.evt-table-head{display:grid;grid-template-columns:88px 1fr 90px 100px 88px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
.evt-table-head span{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.07em;text-transform:uppercase;}
.evt-row{display:grid;grid-template-columns:88px 1fr 90px 100px 88px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;align-items:center;transition:background .1s;}
.evt-row:last-child{border-bottom:none;}
.evt-row:active{background:var(--surface2);}
.evt-row .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.evt-row .ename{font-size:14px;font-weight:600;letter-spacing:-.01em;}
.evt-row .esub{font-size:11px;color:var(--muted);margin-top:1px;}
.evt-row .etype{font-size:12px;color:var(--muted);}
.evt-row .etime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.evt-row .eprice{font-size:13px;font-weight:700;text-align:right;letter-spacing:-.02em;}

/* ── Event detail full page ── */
.evt-detail-page{position:fixed;inset:0;background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.evt-detail-page.open{transform:translateX(0);}
.edp-nav{position:sticky;top:0;padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(242,242,240,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:2;}
.edp-back{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--text);background:none;border:none;cursor:pointer;padding:0;}
.edp-back svg{color:var(--blue);}
.edp-actions{display:flex;gap:7px;}
.edp-hero{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.edp-hero .type-pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:3px 10px;margin-bottom:10px;}
.edp-hero h2{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-bottom:4px;}
.edp-hero .loc{font-size:14px;color:var(--muted);}
.edp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.edp-stat{background:var(--surface);padding:14px 14px;display:flex;flex-direction:column;gap:3px;}
.edp-stat .s-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);}
.edp-stat .s-val{font-size:17px;font-weight:700;letter-spacing:-.025em;}
.edp-body{padding:16px;display:flex;flex-direction:column;gap:12px;}
.det-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.det-sec-head{padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
.det-sec-head h4{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.det-sec-body{padding:16px;display:grid;gap:13px;}
.nf{display:flex;flex-direction:column;gap:5px;}
.nf label{font-size:10px;color:var(--muted2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.nf .big-val{font-size:16px;font-weight:600;letter-spacing:-.015em;}
.nf input,.nf textarea{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:10px 12px;font-size:16px;font-family:inherit;color:var(--text);outline:none;resize:none;width:100%;}
.nf input:focus,.nf textarea:focus{border-color:var(--accent);background:var(--surface);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.edp-footer{padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;}
.edp-footer .btn{flex:1;justify-content:center;padding:12px;}

/* ── Empty state ── */
.empty{text-align:center;padding:64px 24px;color:var(--muted);}
.empty .empty-icon{font-size:36px;margin-bottom:14px;opacity:.4;}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty p{font-size:13px;line-height:1.5;}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0;}
.overlay.open{display:flex;}
@media(min-width:600px){.overlay{align-items:center;padding:16px;}}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom);}
@media(min-width:600px){.modal{border-radius:var(--radius);}}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
@media(min-width:600px){.modal-drag{display:none;}}
.modal-head{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h2{font-size:17px;font-weight:700;letter-spacing:-.025em;}
.modal-body{padding:18px 20px;display:grid;gap:12px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:10px 12px;font-size:16px;font-family:inherit;color:var(--text);outline:none;appearance:none;resize:vertical;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);background:var(--surface);}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:11px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;transition:transform .22s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── Responsive ── */
@media(max-width:680px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .stat-grid .stat-card:last-child{grid-column:1/-1;}
  .two-col{grid-template-columns:1fr;}
  .evt-table-head,.evt-row{grid-template-columns:70px 1fr 80px;}
  .evt-table-head span:nth-child(n+4),.evt-row>*:nth-child(n+4){display:none;}
  main,header,.tabs{padding-left:16px;padding-right:16px;}
  .search-wrap input{width:150px;}
  .det-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .modal-body{padding:16px;}
  .modal-head{padding:14px 16px 12px;}
  .modal-foot{padding:12px 16px;}
}
</style>

<!-- Lock screen -->
<div id="lock">
  <div id="lock-box">
    <div id="lock-logo-wrap">
      <img src="logo.png" id="lock-logo-img" />
      <div id="lock-logo">Hjulmann Events</div>
    </div>
    <p id="lock-sub">Log ind på admin</p>
    <div class="lock-field">
      <label>Brugernavn</label>
      <input id="lock-user" type="text" placeholder="admin" onkeydown="if(event.key==='Enter')document.getElementById('lock-input').focus()" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" />
    </div>
    <div class="lock-field">
      <label>Adgangskode</label>
      <div id="lock-pw-wrap">
        <input id="lock-input" type="password" placeholder="••••••••••" onkeydown="if(event.key==='Enter')checkPw()" autocomplete="current-password" autocorrect="off" autocapitalize="none" spellcheck="false" />
        <button id="lock-eye" type="button" onclick="var i=document.getElementById('lock-input');i.type=i.type==='password'?'text':'password';this.innerHTML=i.type==='password'?'<svg width=18 height=18 viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>':'<svg width=18 height=18 viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24\'/><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'/></svg>';" aria-label="Vis adgangskode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

async function sbGet(path){try{const r=await fetch(SB_URL+path,{headers:SB_H});return r.ok?r.json():[];}catch{return[];}}
async function sbPost(path,body){return fetch(SB_URL+path,{method:'POST',headers:{...SB_H,'Prefer':'return=representation'},body:JSON.stringify(body)});}
async function sbPatch(path,body){return fetch(SB_URL+path,{method:'PATCH',headers:{...SB_H,'Prefer':'return=representation'},body:JSON.stringify(body)});}
async function sbDelete(path){return fetch(SB_URL+path,{method:'DELETE',headers:SB_H});}

const KEY='hjulmann-v5';
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch{}return{events:[]};}

function timeAgo(iso){const diff=Date.now()-new Date(iso).getTime();const h=Math.floor(diff/3600000);if(h<1)return'Lige nu';if(h<24)return h+'t siden';const d=Math.floor(h/24);return d===1?'I går':d+' dage siden';}
function daysUntil(s){if(!s)return null;const d=new Date(s+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/(86400000));}

function renderOverview(){
  const rev=data.events.reduce((s,e)=>s+(parseFloat(e.price)||0),0);

  document.getElementById('stat-grid').innerHTML=`

          <div class="eprice">${ev.price?parseFloat(ev.price).toLocaleString('da-DK')+' kr':'–'}</div>
        </div>
      `).join('')}
    </div>
  `;
}

  `).join('');

async function loadInquiries(){
  try{
    const rows=await sbGet('/rest/v1/inquiries?select=*&order=received.desc');
    data.inquiries=rows.map(r=>({...r,unread:r.unread??true,price:r.price||''}));
  }catch{data.inquiries=[];}
}

async function confirmInq(id){
  const q=data.inquiries.find(i=>i.id===id);if(!q)return;
  const ev={id:uid(),name:q.name,type:q.type,date:q.date,guests:q.guests,location:q.location,email:q.email,phone:q.phone,msg:q.msg,address:'',venue:'',startTime:'',endTime:'',notes:'',price:q.price||''};
  data.events.push(ev);saveLocal({events:data.events});
  await sbDelete('/rest/v1/inquiries?id=eq.'+id);
  data.inquiries=data.inquiries.filter(i=>i.id!==id);
  renderOverview();renderInquiries();renderEvents();toast('✓ Booking bekræftet');
  switchTab('events',document.querySelectorAll('.tab-btn')[2]);
}

async function archiveInq(id){
  if(!confirm('Slet denne forespørgsel?'))return;
  await sbDelete('/rest/v1/inquiries?id=eq.'+id);
  data.inquiries=data.inquiries.filter(i=>i.id!==id);
  renderOverview();renderInquiries();toast('Forespørgsel slettet');
}

function doneEvent(id){if(!confirm('Marker som afholdt og slet?'))return;data.events=data.events.filter(e=>e.id!==id);openEvtId=null;saveLocal({events:data.events});closeEvtPage();renderOverview();renderEvents();toast('✓ Event afholdt');}
function rmEvent(id){if(!confirm('Slet dette event?'))return;data.events=data.events.filter(e=>e.id!==id);openEvtId=null;saveLocal({events:data.events});closeEvtPage();renderOverview();renderEvents();toast('Event slettet');}
function updEv(id,key,val){const ev=data.events.find(e=>e.id===id);if(ev){ev[key]=val;saveLocal({events:data.events});renderOverview();}}
async function updInq(id,key,val){
  const q=data.inquiries.find(i=>i.id===id);
  if(q){q[key]=val;await sbPatch('/rest/v1/inquiries?id=eq.'+id,{[key]:val});}
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function openModal(){document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function overlayClick(e){if(e.target.id==='overlay')closeModal();}
function openEvtModal(){document.getElementById('overlay-evt').classList.add('open');}
function closeEvtModal(){document.getElementById('overlay-evt').classList.remove('open');}
function overlayEvtClick(e){if(e.target.id==='overlay-evt')closeEvtModal();}
function openQuickModal(){document.getElementById('q-date').value=new Date().toISOString().slice(0,10);document.getElementById('overlay-quick').classList.add('open');setTimeout(()=>document.getElementById('q-date').focus(),100);}
function closeQuickModal(){document.getElementById('overlay-quick').classList.remove('open');}
function addQuickEvent(){
  const date=document.getElementById('q-date').value;
  if(!date){alert('Dato er påkrævet.');return;}
  const ev={id:uid(),name:'DJ job',type:'Firmafest',date,location:document.getElementById('q-location').value.trim(),price:document.getElementById('q-price').value,guests:'',email:'',phone:'',startTime:'',endTime:'',address:'',venue:'',notes:''};
  data.events.push(ev);saveLocal({events:data.events});
  closeQuickModal();toast('⚡ Aftale oprettet');
  ['q-location','q-price'].forEach(id=>document.getElementById(id).value='');
  renderOverview();renderEvents();
  switchTab('events',document.querySelectorAll('.tab-btn')[2]);
}

async function addInquiry(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){alert('Navn er påkrævet.');return;}
  const inq={name,email:document.getElementById('m-email').value.trim(),phone:document.getElementById('m-phone').value.trim(),type:document.getElementById('m-type').value,date:document.getElementById('m-date').value,guests:document.getElementById('m-guests').value,location:document.getElementById('m-location').value.trim(),msg:document.getElementById('m-msg').value.trim(),unread:true,price:''};
  await sbPost('/rest/v1/inquiries',inq);
  closeModal();toast('Forespørgsel tilføjet');
  ['m-name','m-email','m-phone','m-date','m-location','m-msg'].forEach(id=>document.getElementById(id).value='');
  await render();
}

function addEvent(){
  const name=document.getElementById('e-name').value.trim();
  const date=document.getElementById('e-date').value;
  if(!name||!date){alert('Navn og dato er påkrævet.');return;}
  const ev={id:uid(),name,type:document.getElementById('e-type').value,date,guests:document.getElementById('e-guests').value,location:document.getElementById('e-location').value.trim(),email:document.getElementById('e-email').value.trim(),phone:document.getElementById('e-phone').value.trim(),startTime:document.getElementById('e-start').value,endTime:document.getElementById('e-end').value,price:document.getElementById('e-price').value,address:'',venue:'',notes:''};
  data.events.push(ev);saveLocal({events:data.events});
  closeEvtModal();toast('✓ Aftale oprettet');
  ['e-name','e-date','e-start','e-end','e-location','e-price','e-phone','e-email'].forEach(id=>document.getElementById(id).value='');
  renderOverview();renderEvents();
  switchTab('events',document.querySelectorAll('.tab-btn')[2]);
}

function exportData(){
  const rows=[['Navn','Email','Telefon','Type','Dato','Gæster','Lokation','Besked','Pris']];
  [...data.inquiries,...data.events].forEach(r=>rows.push([r.name,r.email,r.phone,r.type,r.date,r.guests,r.location,r.msg||r.notes,(r.price||'')+' kr']));
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='hjulmann.csv';a.click();
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}

function sendNotif(title,body){if('Notification' in window&&Notification.permission==='granted'){new Notification(title,{body,icon:'logo.png'});}}

async function enableNotifications(){
  if(!('Notification' in window)){toast('Notifikationer understøttes ikke');return;}
  if(Notification.permission==='granted'){toast('Notifikationer er allerede aktiveret ✓');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){toast('Notifikationer aktiveret ✓');renderNotifBanner();}
  else{toast('Notifikationer blev ikke tilladt');}
}

function renderNotifBanner(){
  const existing=document.getElementById('notif-banner');
  if(existing)existing.remove();
  if(!('Notification' in window)||Notification.permission==='granted')return;
  const banner=document.createElement('div');
  banner.id='notif-banner';
  banner.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow-sm);';
  banner.innerHTML='<div><div style="font-size:13px;font-weight:600;">Få besked om nye forespørgsler</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">Tryk for at aktivere notifikationer</div></div><button class="btn btn-dark btn-sm" onclick="enableNotifications()">Aktiver</button>';
  document.getElementById('tab-overblik').prepend(banner);
}

let prevInqCount=null;
async function pollInquiries(){
  const before=prevInqCount;
  await loadInquiries();
  if(before!==null&&data.inquiries.length>before){
    const newest=data.inquiries[0];
    sendNotif('Ny forespørgsel 🎉',newest?newest.name+(newest.date?' · '+fmtDate(newest.date):''):'');
  }
  prevInqCount=data.inquiries.length;
  renderOverview();renderInquiries();
}

render().then(()=>{prevInqCount=data.inquiries.length;renderNotifBanner();});
setInterval(pollInquiries,30000);
</script>
